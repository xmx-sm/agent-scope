# agent_scope 子路径部署（Nginx :5080）
#
# 用法：把本文件内容 include 进监听 5080 的 server 块，或直接追加到
# /etc/nginx/conf.d/5080.conf 的 `location / { ... }` 之前。
# 前端需以 VITE_BASE=/agent_scope/、VITE_API_BASE=/agent_scope/api 构建，
# 产物部署到 /var/www/html/agent_scope；后端监听 127.0.0.1:8000。

location = /agent_scope { return 301 /agent_scope/; }

# 入口 HTML 不缓存：保证刷新拿到最新带 hash 的资源引用。
location = /agent_scope/index.html {
    alias /var/www/html/agent_scope/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

location /agent_scope/assets/ {
    alias /var/www/html/agent_scope/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# /agent_scope/api/* -> 后端 /api/*（剥掉 /agent_scope 前缀）
location /agent_scope/api/ {
    rewrite ^/agent_scope/api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;      # 附件/知识库文档上传
    proxy_buffering off;           # 对话 SSE 逐块透传
    proxy_cache off;
    proxy_read_timeout 3600s;      # 长对话/断线续传
}

# 标准 A2A Agent Card：/agent_scope/.well-known/agent-card.json -> 后端 /.well-known/agent-card.json
location = /agent_scope/.well-known/agent-card.json {
    proxy_pass http://127.0.0.1:8000/.well-known/agent-card.json;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SPA：history 路由深链一律回落 index.html。
location /agent_scope/ {
    alias /var/www/html/agent_scope/;
    index index.html;
    try_files $uri $uri/ /agent_scope/index.html;
}
